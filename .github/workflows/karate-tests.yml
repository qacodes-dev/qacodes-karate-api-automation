name: Karate API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Karate tests
        run: mvn -B clean test
        # Credentials: this project targets the public Restful Booker demo API whose
        # creds are documented publicly (admin / password123). In a real project,
        # store them in GitHub Secrets and pass as -Dqa.username / -Dqa.password.

      - name: Upload Karate HTML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-reports
          path: |
            target/karate-reports/
            target/surefire-reports/
          retention-days: 30
